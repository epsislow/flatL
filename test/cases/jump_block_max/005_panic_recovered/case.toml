suite = "jump_block_max"
id = 5
desc = "jump.block.reached.max recoverable via #panic.any"
kind = "pipeline"

source = "program.fl"
compile = "{root}/bin/flc -o {tmp}/out.fb {src}"
run = "{root}/bin/flvm --no-jump-limit {tmp}/out.fb"
expect_exit = 0
stdout_contains = "jump.block.reached.max"
stdout_contains_2 = "handled"
