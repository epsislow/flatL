suite = "jump_block_max"
id = 1
desc = "global jump:blockMax 3 — 4th jump to same block panics"
kind = "pipeline"

source = "program.fl"
compile = "{root}/bin/flc -o {tmp}/out.fb {src}"
run = "{root}/bin/flvm --no-jump-limit {tmp}/out.fb"
expect_exit = 1
stderr_contains = "unhandled PANIC: jump.block.reached.max"
