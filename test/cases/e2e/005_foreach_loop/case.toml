suite = "e2e"
id = 5
desc = "foreach two iterations"
kind = "pipeline"

source = "program.fl"
compile = "{root}/bin/flc -o {tmp}/out.fb {src}"
run = "{root}/bin/flvm {tmp}/out.fb"
expect_exit = 0
stdout_contains = "a"
stdout_contains_2 = "b"

[flatl]
crun = "{root}/bin/flatl crun -o {tmp}/out.fb {src}"
