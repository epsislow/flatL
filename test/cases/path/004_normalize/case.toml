suite = "path"
mods = "path"
id = 4
desc = "path.normalize collapses . .. and mixed seps"
kind = "pipeline"
source = "program.fl"
compile = "{root}/bin/flc -o {tmp}/out.fb {src}"
run = "{root}/bin/flvm --path-sep / {tmp}/out.fb </dev/null"
