suite = "path"
mods = "path"
id = 1
desc = "path.join variadic with --path-sep /"
kind = "pipeline"
source = "program.fl"
compile = "{root}/bin/flc -o {tmp}/out.fb {src}"
run = "{root}/bin/flvm --path-sep / {tmp}/out.fb </dev/null"
expect_exit = 0
stdout_contains = "a/b/c.fl"
stdout_contains_2 = "/root/x"
stdout_contains_3 = "/abs/b"
