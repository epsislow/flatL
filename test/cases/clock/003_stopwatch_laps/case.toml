suite = "clock"
id = 3
desc = "stopwatch lifecycle, elapsed time, laps, reset, and mem resource kind"
kind = "pipeline"
source = "program.fl"
compile = "{root}/bin/flc -o {tmp}/out.fb {src}"
run = "{root}/bin/flvm {tmp}/out.fb </dev/null"
expect_exit = 0
stdout_contains = "clock stopwatch laps ok"

[flatl]
crun = "{root}/bin/flatl crun -o {tmp}/out.fb {src}"
expect_exit = 0
