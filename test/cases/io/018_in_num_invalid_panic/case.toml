suite = "io"
id = 18
desc = "in_num invalid panic"
kind = "pipeline"

source = "program.fl"
compile = "{root}/bin/flc -o {tmp}/out.fb {src}"
run = "printf 'xx\n' | {root}/bin/flvm {tmp}/out.fb"
expect_exit = 0
stdout_contains = "parse"

[flatl]
compile = "{root}/bin/flatl compile -o {tmp}/out.fb {src}"
run = "printf 'xx\n' | {root}/bin/flatl run {tmp}/out.fb"
