suite = "io"
id = 11
desc = "in_bool yes"
kind = "pipeline"

source = "program.fl"
compile = "{root}/bin/flc -o {tmp}/out.fb {src}"
run = "printf 'yes\n' | {root}/bin/flvm {tmp}/out.fb"
expect_exit = 0
stdout_contains = "true"

[flatl]
compile = "{root}/bin/flatl compile -o {tmp}/out.fb {src}"
run = "printf 'yes\n' | {root}/bin/flatl run {tmp}/out.fb"
