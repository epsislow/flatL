suite = "io"
id = 14
desc = "inln empty cancel"
kind = "pipeline"

source = "program.fl"
compile = "{root}/bin/flc -o {tmp}/out.fb {src}"
run = "printf '\n' | {root}/bin/flvm {tmp}/out.fb"
expect_exit = 1
stderr_contains = "unhandled PANIC: io.user_cancel"

[flatl]
compile = "{root}/bin/flatl compile -o {tmp}/out.fb {src}"
run = "printf '\n' | {root}/bin/flatl run {tmp}/out.fb"
expect_exit = 1
stderr_contains = "unhandled PANIC: io.user_cancel"
