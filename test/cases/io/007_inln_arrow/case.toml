suite = "io"
id = 7
desc = "inln arrow"
kind = "pipeline"

source = "program.fl"
compile = "{root}/bin/flc -o {tmp}/out.fb {src}"
run = "printf 'hello\n' | {root}/bin/flvm {tmp}/out.fb"
expect_exit = 0
stdout_contains = "hello"

[flatl]
compile = "{root}/bin/flatl compile -o {tmp}/out.fb {src}"
run = "printf 'hello\n' | {root}/bin/flatl run {tmp}/out.fb"
