suite = "io"
id = 10
desc = "in_num"
kind = "pipeline"

source = "program.fl"
compile = "{root}/bin/flc -o {tmp}/out.fb {src}"
run = "printf '3.5\n' | {root}/bin/flvm {tmp}/out.fb"
expect_exit = 0
stdout_contains = "3.5"

[flatl]
compile = "{root}/bin/flatl compile -o {tmp}/out.fb {src}"
run = "printf '3.5\n' | {root}/bin/flatl run {tmp}/out.fb"
