suite = "io"
id = 5
desc = "out list"
kind = "pipeline"

source = "program.fl"
compile = "{root}/bin/flc -o {tmp}/out.fb {src}"
run = "printf '' | {root}/bin/flvm {tmp}/out.fb"
expect_exit = 0
stdout_contains = "1,2"

[flatl]
compile = "{root}/bin/flatl compile -o {tmp}/out.fb {src}"
run = "printf '' | {root}/bin/flatl run {tmp}/out.fb"
