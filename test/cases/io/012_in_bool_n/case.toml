suite = "io"
id = 12
desc = "in_bool n"
kind = "pipeline"

source = "program.fl"
compile = "{root}/bin/flc -o {tmp}/out.fb {src}"
run = "printf 'n\n' | {root}/bin/flvm {tmp}/out.fb"
expect_exit = 0
stdout_contains = "false"

[flatl]
compile = "{root}/bin/flatl compile -o {tmp}/out.fb {src}"
run = "printf 'n\n' | {root}/bin/flatl run {tmp}/out.fb"
