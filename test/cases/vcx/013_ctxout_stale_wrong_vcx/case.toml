suite = "vcx"
id = 13
desc = "PANIC io.ctx_stale when ctxout targets buf in global but active VCX has no matching buf ref"
kind = "pipeline"
source = "program.fl"
compile = "{root}/bin/flc -o {tmp}/out.fb {src}"
run = "printf '' | {root}/bin/flvm {tmp}/out.fb"
expect_exit = 1
stderr_contains = "io.ctx_stale"
