suite = "http"
id = 12
desc = "transportOk panics with http.transport.timeout"
kind = "pipeline"
source = "program.fl"
compile = "{root}/bin/flc -o {tmp}/out.fb {src}"
run = "{root}/bin/flvm {tmp}/out.fb </dev/null"
expect_exit = 1
stderr_contains = "http.transport.timeout"

[http.mock]
method = "GET"
path = "/slow"
error_code = 28
error = "mock timeout"
