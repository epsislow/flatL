suite = "http"
mods = "http"
id = 11
desc = "transportOk and statusOk pass for HTTP 200"
kind = "pipeline"
source = "program.fl"
compile = "{root}/bin/flc -o {tmp}/out.fb {src}"
run = "{root}/bin/flvm {tmp}/out.fb </dev/null"
