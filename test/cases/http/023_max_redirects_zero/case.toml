suite = "http"
mods = "http"
id = 23
desc = "maxRedirects(0) keeps first 3xx without panic"
kind = "pipeline"
source = "program.fl"
compile = "{root}/bin/flc -o {tmp}/out.fb {src}"
run = "{root}/bin/flvm {tmp}/out.fb </dev/null"
expect_exit = 0
stdout_contains = "0"
stdout_contains_2 = "301"
stdout_contains_3 = "1"

[http.mock]
method = "GET"
path = "/chain"
status = 200
body = "final"
redirect_statuses = [301, 302, 200]
