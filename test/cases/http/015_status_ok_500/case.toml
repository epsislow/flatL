suite = "http"
mods = "http"
id = 15
desc = "statusOk panics with http.status.server_error on 5xx"
kind = "pipeline"
source = "program.fl"
compile = "{root}/bin/flc -o {tmp}/out.fb {src}"
run = "{root}/bin/flvm {tmp}/out.fb </dev/null"
expect_exit = 1
stderr_contains = "http.status.server_error"

[http.mock]
method = "GET"
path = "/boom"
status = 500
body = "err"
