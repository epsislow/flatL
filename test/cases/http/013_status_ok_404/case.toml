suite = "http"
id = 13
desc = "statusOk panics with http.status.not_found on 404; transport still OK"
kind = "pipeline"
source = "program.fl"
compile = "{root}/bin/flc -o {tmp}/out.fb {src}"
run = "{root}/bin/flvm {tmp}/out.fb </dev/null"
expect_exit = 1
stderr_contains = "http.status.not_found"

[http.mock]
method = "GET"
path = "/missing"
status = 404
body = "not-found"
