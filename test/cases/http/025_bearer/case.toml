suite = "http"
mods = "http"
id = 25
desc = "http.bearer rewrites Authorization header"
kind = "pipeline"
source = "program.fl"
compile = "{root}/bin/flc -o {tmp}/out.fb {src}"
run = "{root}/bin/flvm {tmp}/out.fb </dev/null"
expect_exit = 0
stdout_contains = "1"
stdout_contains_2 = "Bearer tok-2"
stdout_contains_3 = "200"

[http.mock]
method = "GET"
path = "/auth"
status = 200
body = "ok"
