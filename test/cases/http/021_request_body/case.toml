suite = "http"
mods = "http"
id = 21
desc = "requestBody get/set for raw request body; responseBody for response"
kind = "pipeline"
source = "program.fl"
compile = "{root}/bin/flc -o {tmp}/out.fb {src}"
run = "{root}/bin/flvm {tmp}/out.fb </dev/null"
