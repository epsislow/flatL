suite = "http"
id = 3
desc = "transport timeout is exposed separately from HTTP status"
kind = "pipeline"
source = "program.fl"
compile = "{root}/bin/flc -o {tmp}/out.fb {src}"
run = "{root}/bin/flvm {tmp}/out.fb </dev/null"
expect_exit = 0
stdout_contains = "0"
stdout_contains_2 = "28"
stdout_contains_3 = "mock timeout"

[http.mock]
method = "GET"
path = "/slow"
error_code = 28
error = "mock timeout"
