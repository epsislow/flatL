suite = "http"
mods = "http"
id = 2
desc = "HTTP 404 is a response, not a transport error"
kind = "pipeline"
source = "program.fl"
compile = "{root}/bin/flc -o {tmp}/out.fb {src}"
run = "{root}/bin/flvm {tmp}/out.fb </dev/null"
