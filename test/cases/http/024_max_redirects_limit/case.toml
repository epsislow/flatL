suite = "http"
mods = "http"
id = 24
desc = "exceeding maxRedirects panics http.redirect.limit"
kind = "pipeline"
source = "program.fl"
compile = "{root}/bin/flc -o {tmp}/out.fb {src}"
run = "{root}/bin/flvm {tmp}/out.fb </dev/null"
expect_exit = 1
stderr_contains = "http.redirect.limit"

[http.mock]
method = "GET"
path = "/chain"
status = 200
body = "final"
redirect_statuses = [301, 302, 200]
