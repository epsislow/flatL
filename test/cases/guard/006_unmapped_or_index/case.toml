suite = "guard"
id = 6
desc = "unmapped guard inside #or handler by instruction index (no line label)"
kind = "pipeline"

source = "program.fl"
compile = "{root}/bin/flc -o {tmp}/out.fb {src}"
run = "{root}/bin/flvm {tmp}/out.fb"
expect_exit = 2
stderr_contains = "unmapped guard at #or.#main.entry.1"