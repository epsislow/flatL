suite = "local_blocks"
id = 1
desc = "for uses an indented local block"
kind = "pipeline"
source = "program.fl"
compile = "{root}/bin/flc -o {tmp}/out.fb {src}"
run = "{root}/bin/flvm {tmp}/out.fb"
expect_exit = 0
stdout_contains = "0"
stdout_contains_2 = "1"
stdout_contains_3 = "2"
stdout_contains_4 = "done"

[flatl]
crun = "{root}/bin/flatl crun -o {tmp}/out.fb {src}"
expect_exit = 0
stdout_contains = "0"
stdout_contains_2 = "1"
stdout_contains_3 = "2"
stdout_contains_4 = "done"
