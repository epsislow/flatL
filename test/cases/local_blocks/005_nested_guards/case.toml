suite = "local_blocks"
id = 5
desc = "nested local guard handlers preserve #or behavior"
kind = "pipeline"
source = "program.fl"
compile = "{root}/bin/flc -o {tmp}/out.fb {src}"
run = "{root}/bin/flvm {tmp}/out.fb"
expect_exit = 2
stdout_contains = "nested guard"

[flatl]
crun = "{root}/bin/flatl crun -o {tmp}/out.fb {src}"
expect_exit = 2
stdout_contains = "nested guard"
