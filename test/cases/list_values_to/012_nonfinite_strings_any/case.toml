suite = "list_values_to"
id = 12
desc = "f64 any preserves all non-finite numeric strings"
kind = "pipeline"
source = "program.fl"
compile = "{root}/bin/flc -o {tmp}/out.fb {src}"
run = "printf '' | {root}/bin/flvm {tmp}/out.fb"
expect_exit = 0
stdout_contains = '[2,"+inf","Infinity","nan(foo)","1e309"]'
