suite = "for"
id = 7
desc = "return from loop body exits for after i==1 (no further indices)"
kind = "pipeline"

source = "program.fl"
compile = "{root}/bin/flc -o {tmp}/out.fb {src}"
run = "{root}/bin/flvm {tmp}/out.fb"
expect_exit = 0
stdout_contains = "0"
stdout_contains_2 = "1"
stdout_contains_3 = "after"
stdout_must_not_contain = "2"
