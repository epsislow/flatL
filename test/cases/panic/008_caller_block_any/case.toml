suite = "panic"
id = 8
desc = "caller block-scoped .any catches panic from a nested called block"
kind = "pipeline"
source = "program.fl"
compile = "{root}/bin/flc -o {tmp}/out.fb {src}"
run = "{root}/bin/flvm {tmp}/out.fb"
expect_exit = 0
stdout_contains = "#inner.2"
stdout_contains_2 = "worker recovered nested panic"

[flatl]
crun = "{root}/bin/flatl crun -o {tmp}/out.fb {src}"
expect_exit = 0
stdout_contains = "#inner.2"
stdout_contains_2 = "worker recovered nested panic"
