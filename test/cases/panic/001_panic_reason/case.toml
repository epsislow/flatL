suite = "panic"
id = 1
desc = "panicReason persists until panicReset; empty when none"
kind = "pipeline"

source = "program.fl"
compile = "{root}/bin/flc -o {tmp}/out.fb {src}"
run = "{root}/bin/flvm {tmp}/out.fb"
expect_exit = 0
stdout_contains = "for.ntimes_type"
stdout_contains_2 = "handled"

[flatl]
crun = "{root}/bin/flatl crun -o {tmp}/out.fb {src}"
expect_exit = 0
stdout_contains = "for.ntimes_type"
stdout_contains_2 = "handled"
