suite = "assign"
id = 19
desc = "b32 blob literal RFC 4648 base32hex"
kind = "pipeline"

source = "program.fl"
compile = "{root}/bin/flc -o {tmp}/out.fb {src}"
run = "printf '' | {root}/bin/flvm {tmp}/out.fb"
