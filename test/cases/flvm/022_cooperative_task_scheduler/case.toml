cmd = "{root}/bin/flc -o {tmp}/task_ok.fb {root}/test/cases/flvm/019_vm_stepping/program.fl && {root}/bin/flc -o {tmp}/task_fail.fb {root}/test/cases/flvm/021_vm_failure_lifecycle/fail.fl && make -s test-cooperative-task-scheduler TEST_BIN={tmp}/cooperative_task_scheduler_test && {tmp}/cooperative_task_scheduler_test {tmp}/task_ok.fb {tmp}/task_fail.fb"
expect_exit = 0
