suite = "flvm"
id = 3
desc = "flvm --trace emits opcode log"
kind = "pipeline"

source = "program.fl"
compile = "{root}/bin/flc -o {tmp}/out.fb {src}"
run = "{root}/bin/flvm --trace {tmp}/out.fb"
expect_exit = 0
stderr_contains = "[trace]"

[flatl]
crun = "{root}/bin/flatl crun --trace -o {tmp}/out.fb {src}"
