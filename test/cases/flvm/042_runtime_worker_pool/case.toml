suite = "flvm"
id = 42
desc = "runtime worker pool executes tasks concurrently and joins after DRAIN and CANCEL"
kind = "exec"
cmd = "printf '[stage:flc-main]\n' >&2 && {root}/bin/flc -o {tmp}/runtime_worker_pool.fb {root}/test/cases/flvm/042_runtime_worker_pool/program.fl && printf '[stage:flc-unsupported]\n' >&2 && {root}/bin/flc -o {tmp}/runtime_worker_unsupported.fb {root}/test/cases/flvm/042_runtime_worker_pool/unsupported.fl && printf '[stage:make-harness]\n' >&2 && make -s test-runtime-worker-pool TEST_BIN={tmp}/runtime_worker_pool_test && printf '[stage:run-harness]\n' >&2 && {tmp}/runtime_worker_pool_test {tmp}/runtime_worker_pool.fb {tmp}/runtime_worker_unsupported.fb"
expect_exit = 0
stdout_contains = "runtime-worker-pool-ok workers=4 tasks=96 drain=joined cancel=joined unsupported-native=preflight-rejected multi-runtime-worker-mode=balanced"
