suite = "flvm"
id = 21
desc = "FlatVm failure outcomes and destruction after yield clean up correctly"
kind = "exec"
cmd = "{root}/bin/flc -o {tmp}/fail.fb {case}/fail.fl && {root}/bin/flc -o {tmp}/panic.fb {case}/panic.fl && {root}/bin/flc -o {tmp}/destroy_yield.fb {case}/destroy_yield.fl && make -s test-vm-failure-lifecycle TEST_BIN={tmp}/vm_failure_lifecycle_test && {tmp}/vm_failure_lifecycle_test {tmp}/fail.fb {tmp}/panic.fb {tmp}/destroy_yield.fb"
expect_exit = 0
stdout_contains = "vm-failure-lifecycle-ok"
