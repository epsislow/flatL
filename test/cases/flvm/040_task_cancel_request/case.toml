suite = "flvm"
mods = "dom"
id = 40
desc = "request-only task cancellation is idempotent and scheduler-owned across CREATED, RUNNABLE, WAITING and RUNNING"
kind = "exec"
cmd = "printf '[stage:flc-main]\n' >&2 && {root}/bin/flc -o {tmp}/cancel_request.fb {root}/test/cases/flvm/019_vm_stepping/program.fl && printf '[stage:flc-dom]\n' >&2 && {root}/bin/flc -o {tmp}/cancel_request_dom.fb {root}/test/cases/flvm/038_runtime_scheduler_mutex/dom_cleanup.fl && printf '[stage:make-harness]\n' >&2 && make -s test-task-cancel-request TEST_BIN={tmp}/task_cancel_request_test && printf '[stage:run-harness]\n' >&2 && {tmp}/task_cancel_request_test {tmp}/cancel_request.fb {tmp}/cancel_request_dom.fb"
expect_exit = 0
stdout_contains = "task-cancel-request-ok states=created,runnable,waiting,running owner-cleanup=verified"
