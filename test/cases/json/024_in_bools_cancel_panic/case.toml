suite = "json"
id = 24
desc = "in bools cancel panics io.user_cancel"
kind = "pipeline"

source = "program.fl"
compile = "{root}/bin/flc -o {tmp}/out.fb {src}"
run = "printf 'q\n' | {root}/bin/flvm {tmp}/out.fb"
expect_exit = 1
stderr_contains = "unhandled PANIC: io.user_cancel"
stdout_must_not_contain = "bad"

[flatl]
compile = "{root}/bin/flatl compile -o {tmp}/out.fb {src}"
run = "printf 'q\n' | {root}/bin/flatl run {tmp}/out.fb"
expect_exit = 1
stderr_contains = "unhandled PANIC: io.user_cancel"
stdout_must_not_contain = "bad"
