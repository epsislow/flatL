suite = "json"
id = 15
desc = "in list json array"
kind = "pipeline"

source = "program.fl"
compile = "{root}/bin/flc -o {tmp}/out.fb {src}"
run = "printf '[9,8]\n' | {root}/bin/flvm {tmp}/out.fb"
expect_exit = 0
stdout_contains = "9,8"

[flatl]
compile = "{root}/bin/flatl compile -o {tmp}/out.fb {src}"
run = "printf '[9,8]\n' | {root}/bin/flatl run {tmp}/out.fb"
