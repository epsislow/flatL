suite = "json"
id = 16
desc = "in object json line"
kind = "pipeline"

source = "program.fl"
compile = "{root}/bin/flc -o {tmp}/out.fb {src}"
run = "printf '{"k":1}\n' | {root}/bin/flvm {tmp}/out.fb"
expect_exit = 0
stdout_contains = "J:"

[flatl]
compile = "{root}/bin/flatl compile -o {tmp}/out.fb {src}"
run = "printf '{"k":1}\n' | {root}/bin/flatl run {tmp}/out.fb"
