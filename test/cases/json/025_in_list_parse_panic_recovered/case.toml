suite = "json"
id = 25
desc = "in list parse panic recovered"
kind = "pipeline"

source = "program.fl"
compile = "{root}/bin/flc -o {tmp}/out.fb {src}"
run = "printf '[1,,2]\n' | {root}/bin/flvm {tmp}/out.fb"
expect_exit = 0
stdout_contains = "parse"

[flatl]
compile = "{root}/bin/flatl compile -o {tmp}/out.fb {src}"
run = "printf '[1,,2]\n' | {root}/bin/flatl run {tmp}/out.fb"
