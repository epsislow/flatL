suite = "memory"
id = 1
desc = "free sets var to null; idempotent free; reassign after free"
kind = "pipeline"

source = "program.fl"
compile = "{root}/bin/flc -o {tmp}/out.fb {src}"
run = "printf '' | {root}/bin/flvm {tmp}/out.fb"
expect_exit = 0
stdout_contains = "null"

[flatl]
crun = "{root}/bin/flatl crun -o {tmp}/out.fb {src}"
