suite = "enc"
mods = "enc"
id = 2
desc = "enc base64 / base64url round-trip"
kind = "pipeline"

source = "program.fl"
compile = "{root}/bin/flc -o {tmp}/out.fb {src}"
run = "printf '' | {root}/bin/flvm {tmp}/out.fb"
expect_exit = 0
stdout_contains = "ok"

[flatl]
crun = "{root}/bin/flatl crun -o {tmp}/out.fb {src}"
expect_exit = 0
stdout_contains = "ok"
