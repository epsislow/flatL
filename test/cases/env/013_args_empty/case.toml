suite = "env"
mods = "env"
id = 13
desc = "env.argc is 0 when no program args"
kind = "pipeline"
source = "program.fl"
compile = "{root}/bin/flc -o {tmp}/out.fb {src}"
run = "{root}/bin/flvm {tmp}/out.fb </dev/null"
expect_exit = 0
stdout_contains = "0"

[flatl]
crun = "{root}/bin/flatl crun -o {tmp}/out.fb {src}"
expect_exit = 0
stdout_contains = "0"
