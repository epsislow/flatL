suite = "env"
mods = "env"
id = 1
desc = "env.get via flvm --env KEY=VAL"
kind = "pipeline"
source = "program.fl"
compile = "{root}/bin/flc -o {tmp}/out.fb {src}"
run = "{root}/bin/flvm --env FLAT_ENV_CLI=from_cli {tmp}/out.fb </dev/null"
expect_exit = 0
stdout_contains = "from_cli"

[flatl]
crun = "{root}/bin/flatl crun --env FLAT_ENV_CLI=from_cli -o {tmp}/out.fb {src}"
expect_exit = 0
