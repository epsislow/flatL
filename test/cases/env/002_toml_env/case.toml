suite = "env"
mods = "env"
id = 2
desc = "env.get via [env] in case.toml (process inject)"
kind = "pipeline"
source = "program.fl"
compile = "{root}/bin/flc -o {tmp}/out.fb {src}"
run = "{root}/bin/flvm {tmp}/out.fb </dev/null"
expect_exit = 0
stdout_contains = "from_toml"
stdout_contains_2 = "secret"

[env]
FLAT_ENV_TOML = "from_toml"
FLAT_ENV_TOKEN = "secret"

[flatl]
crun = "{root}/bin/flatl crun -o {tmp}/out.fb {src}"
expect_exit = 0
