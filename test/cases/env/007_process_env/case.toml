suite = "env"
mods = "env"
id = 7
desc = "env.get reads process environment (no --env / no [env])"
kind = "pipeline"
source = "program.fl"
compile = "{root}/bin/flc -o {tmp}/out.fb {src}"
run = "FLAT_ENV_PROC=from_process {root}/bin/flvm {tmp}/out.fb </dev/null"
expect_exit = 0
stdout_contains = "from_process"
