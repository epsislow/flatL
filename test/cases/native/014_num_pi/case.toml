suite = "native"
id = 14
desc = "math.trig num_pi and deg_to_rad(180)"
kind = "pipeline"

source = "program.fl"
compile = "{root}/bin/flc -o {tmp}/out.fb {src}"
run = "printf '' | {root}/bin/flvm {tmp}/out.fb"
expect_exit = 0
stdout_contains = "3.14"

[flatl]
crun = "{root}/bin/flatl crun -o {tmp}/out.fb {src}"
