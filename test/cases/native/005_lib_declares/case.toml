suite = "native"
id = 5
desc = "use native alias in import applies only in that file's blocks"
kind = "pipeline"

source = "program.fl"
compile = "{root}/bin/flc -o {tmp}/out.fb {src}"
run = "printf '' | {root}/bin/flvm {tmp}/out.fb"
expect_exit = 0
stdout_contains = "1"

[flatl]
crun = "{root}/bin/flatl crun -o {tmp}/out.fb {src}"
