suite = "native"
id = 1
desc = "math.trig with alias: sin and cos"
kind = "pipeline"

source = "program.fl"
compile = "{root}/bin/flc -o {tmp}/out.fb {src}"
run = "printf '' | {root}/bin/flvm {tmp}/out.fb"
expect_exit = 0
stdout_contains = "0"

[flatl]
crun = "{root}/bin/flatl crun -o {tmp}/out.fb {src}"
