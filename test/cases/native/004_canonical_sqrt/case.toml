suite = "native"
id = 4
desc = "canonical math.trig.sqrt without alias"
kind = "pipeline"

source = "program.fl"
compile = "{root}/bin/flc -o {tmp}/out.fb {src}"
run = "printf '' | {root}/bin/flvm {tmp}/out.fb"
expect_exit = 0
stdout_contains = "2"

[flatl]
crun = "{root}/bin/flatl crun -o {tmp}/out.fb {src}"
