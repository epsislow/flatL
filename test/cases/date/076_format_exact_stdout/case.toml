suite = "date"
id = 76
desc = "parse_auto(now)+format markers; no spurious quotes in pattern"
kind = "pipeline"
source = "program.fl"
compile = "{root}/bin/flc -o {tmp}/out.fb {src}"
run = "FLAT_DATE_NOW_SEC=1790769600 {root}/bin/flvm {tmp}/out.fb </dev/null"
expect_exit = 0
stdout_contains = "start2026-09-30 12:00:00end"
stdout_must_not_contain = "'"