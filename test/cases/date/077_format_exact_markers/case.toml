suite = "date"
id = 77
desc = "date.format(sec) markers; exact stdout slice"
kind = "pipeline"
source = "program.fl"
compile = "{root}/bin/flc -o {tmp}/out.fb {src}"
run = "printf '' | {root}/bin/flvm {tmp}/out.fb"
expect_exit = 0
stdout_contains = "start2026-09-30 12:00:00end"
stdout_must_not_contain = "'"