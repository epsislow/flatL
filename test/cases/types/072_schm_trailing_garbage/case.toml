suite = "types"
id = 72
desc = "reject SCHM with trailing garbage at load"
kind = "exec"
cmd = "cc -Wall -Wextra -std=c11 {case}/patch_schm_tail.c -o {tmp}/patch_schm_tail && {root}/bin/flc -o {tmp}/ok.fb {case}/program.fl && {tmp}/patch_schm_tail {tmp}/ok.fb && printf \"\" | {root}/bin/flvm {tmp}/ok.fb"
expect_exit = 1
stderr_contains = "invalid SCHM section"
