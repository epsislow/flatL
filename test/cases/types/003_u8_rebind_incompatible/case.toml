suite = "types"
id = 3
desc = "untyped rebind must match u8 contract"
kind = "pipeline"

source = "program.fl"
compile = "{root}/bin/flc -o {tmp}/out.fb {src}"
run = "printf '' | {root}/bin/flvm {tmp}/out.fb"
expect_exit = 1
stderr_contains = "type.assign.incompatible"
stdout_contains = "unhandled PANIC"
